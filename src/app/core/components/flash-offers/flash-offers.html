<section class="py-8 bg-blue-600 relative overflow-hidden">
  <!-- Diagonal stripe background -->
  <div
    class="absolute inset-0"
    style="
      background-image: linear-gradient(
        45deg,
        transparent 25%,
        rgba(255, 255, 255, 0.05) 50%,
        transparent 75%,
        transparent 100%
      );
      background-size: 20px 20px;
    "
  ></div>

  <div class="container mx-auto px-4 relative z-10">
    <div
      class="flex flex-col md:flex-row justify-between items-end md:items-center mb-6 gap-4 border-b border-blue-400/30 pb-4"
    >
      <div class="flex items-center gap-3">
        <app-icon name="zap" class="text-yellow-400 fill-current animate-pulse w-8 h-8"></app-icon>
        <div>
          <h2 class="text-2xl font-black text-white italic uppercase tracking-tight">
            Oferta Relâmpago
          </h2>
          <p class="text-blue-200 text-xs font-bold">PREÇOS IMBATÍVEIS POR TEMPO LIMITADO</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <span class="text-white text-sm font-bold uppercase hidden md:inline">Termina em:</span>
        <app-count-down-timer></app-count-down-timer>
      </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      @for (product of offers; track product.id) {
        <app-product-card [product]="product" [isFlash]="true"></app-product-card>
      }
    </div>
  </div>
</section>
