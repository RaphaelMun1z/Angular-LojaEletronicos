<section class="relative overflow-hidden bg-stone-900 py-8">
  <div
    class="absolute inset-0"
    style="
      background-image: linear-gradient(
        45deg,
        transparent 25%,
        rgba(255, 255, 255, 0.05) 50%,
        transparent 75%,
        transparent 100%
      );
      background-size: 24px 24px;
    "
  ></div>
  <div class="absolute inset-0 bg-[radial-gradient(circle_at_top_left,_rgba(194,65,12,0.3),_transparent_30%)]"></div>

  <div class="container mx-auto relative z-10 px-4">
    <div
      class="mb-6 flex flex-col items-end justify-between gap-4 border-b border-white/10 pb-4 md:flex-row md:items-center"
    >
      <div class="flex items-center gap-3">
        <app-icon name="zap" class="h-8 w-8 fill-current text-amber-400"></app-icon>
        <div>
          <h2 class="font-display text-3xl font-black uppercase tracking-wide text-white">
            Giro rapido da oficina
          </h2>
          <p class="text-xs font-bold uppercase tracking-[0.25em] text-stone-400">
            PRECOS ESPECIAIS POR TEMPO LIMITADO
          </p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <span class="hidden font-display text-sm font-bold uppercase tracking-wide text-white md:inline">
          Termina em:
        </span>
        <app-count-down-timer></app-count-down-timer>
      </div>
    </div>

    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
      @for (product of offers; track product.id) {
        <app-product-card [product]="product" [isFlash]="true"></app-product-card>
      }
    </div>
  </div>
</section>
