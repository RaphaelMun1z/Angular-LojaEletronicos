<section class="bg-gray-100 py-8">
  <div class="container mx-auto px-4">
    <h2 class="text-xl font-bold text-gray-800 mb-6 flex items-center gap-2">
      <app-icon name="menu" class="text-orange-600" [size]="20"></app-icon>
      Navegue por Departamentos
    </h2>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
      @for (dept of departments; track dept.id) {
        <div
          class="bg-white p-4 rounded-lg shadow-sm hover:shadow-md cursor-pointer transition flex flex-col items-center justify-center gap-3 group border border-gray-200 hover:border-blue-400"
        >
          <div
            class="bg-blue-50 text-blue-600 p-3 rounded-full group-hover:bg-blue-600 group-hover:text-white transition-colors"
          >
            <app-icon [name]="dept.iconName" [size]="20"></app-icon>
          </div>
          <span class="font-semibold text-sm text-gray-700">{{ dept.name }}</span>
        </div>
      }
    </div>
  </div>
</section>
