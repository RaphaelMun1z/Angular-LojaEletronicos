<section class="bg-stone-100 py-8">
  <div class="container mx-auto px-4">
    <h2
      class="mb-6 flex items-center gap-2 font-display text-2xl font-bold uppercase tracking-wide text-stone-900"
    >
      <app-icon name="menu" class="text-red-700" [size]="20"></app-icon>
      Navegue por categorias
    </h2>
    <div class="grid grid-cols-2 gap-4 md:grid-cols-3 lg:grid-cols-6">
      @for (dept of departments; track dept.id) {
        <div
          class="group flex cursor-pointer flex-col items-center justify-center gap-3 rounded-lg border border-stone-200 bg-white p-4 shadow-sm transition hover:border-red-300 hover:shadow-md"
        >
          <div
            class="rounded-full bg-stone-100 p-3 text-red-700 transition-colors group-hover:bg-red-700 group-hover:text-white"
          >
            <app-icon [name]="dept.iconName" [size]="20"></app-icon>
          </div>
          <span class="font-display text-sm font-semibold uppercase tracking-wide text-stone-700">
            {{ dept.name }}
          </span>
        </div>
      }
    </div>
  </div>
</section>
