<section class="bg-stone-100 py-14" aria-labelledby="faq-title">
  <div class="container mx-auto px-4">
    <div class="mb-8 max-w-3xl">
      <p class="font-display text-sm font-bold uppercase tracking-[0.3em] text-red-700">
        FAQ e conteudo util
      </p>
      <h2 id="faq-title" class="mt-2 font-display text-4xl font-black uppercase tracking-wide text-stone-900">
        Perguntas frequentes sobre compra de autopecas
      </h2>
      <p class="mt-4 text-sm leading-6 text-stone-600">
        Alem de ajudar o usuario, essa secao sustenta SEO semantico com respostas objetivas para
        intencoes de busca comuns no segmento automotivo.
      </p>
    </div>

    <div class="grid gap-4">
      @for (faq of faqs; track faq.question) {
        <details class="group rounded-2xl border border-stone-200 bg-white p-5 shadow-sm">
          <summary class="flex cursor-pointer list-none items-center justify-between gap-4 font-display text-2xl font-bold uppercase tracking-wide text-stone-900">
            <span>{{ faq.question }}</span>
            <app-icon
              name="chevron-right"
              [size]="20"
              class="text-red-700 transition-transform group-open:rotate-90"
            ></app-icon>
          </summary>
          <p class="mt-4 max-w-4xl text-sm leading-7 text-stone-600">{{ faq.answer }}</p>
        </details>
      }
    </div>
  </div>
</section>
